name: Bug report
description: Report behaviour that does not match what is expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, tokens or real sensitive data in logs or screenshots. Redact them first.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that triggers the bug.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead. Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions, operating system, configuration, and anything else relevant.
    validations:
      required: false
  - type: textarea
    id: docs
    attributes:
      label: Affected documentation
      description: Does any document describe this behaviour wrongly? Write "none" if none.
    validations:
      required: false
